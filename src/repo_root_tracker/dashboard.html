<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repo-root-tracker</title>
<style>
:root { color-scheme: light dark; --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --soft:#f6f8fa;
  --ok:#1a7f37; --warn:#8a5a00; --bad:#cf222e; --link:#0969da; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --soft:#161b22;
  --ok:#3fb950; --warn:#d29922; --bad:#ff7b72; --link:#58a6ff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:1200px; margin:0 auto; padding:20px 16px 48px; overflow-wrap:anywhere; }
h1 { font-size:20px; margin:0 0 4px; }
.muted { color:var(--muted); }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:14px 0 8px; }
input[type=search], select, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
input[type=search] { flex:1 1 220px; min-width:0; }
button { cursor:pointer; } button:hover { background:var(--soft); } button[aria-pressed=true] { background:var(--soft); border-color:var(--fg); font-weight:600; }
button:disabled { opacity:.55; cursor:default; }
:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
#status { min-height:1.4em; margin:6px 0; }
table { width:100%; border-collapse:collapse; table-layout:auto; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
tr.child td:first-child { padding-left:34px; }
td.repo { min-width:200px; } .path { display:block; font-size:12px; color:var(--muted); word-break:break-all; }
.toggle { border:0; background:none; padding:0 4px 0 0; font-weight:600; text-align:left; }
.golden { font-weight:600; } .golden.ok { color:var(--ok); } .golden.warn { color:var(--warn); } .golden.bad { color:var(--bad); }
tr.detail td { background:var(--soft); }
dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; margin:0; } dt { color:var(--muted); } dd { margin:0; word-break:break-word; }
.sr { position:absolute; left:-9999px; }
@media (max-width:720px) {
  thead { display:none; } table, tbody, tr, td { display:block; width:100%; }
  tr { border-bottom:1px solid var(--line); padding:6px 0; } td { border:0; padding:2px 10px; }
  td[data-label]::before { content:attr(data-label) ": "; color:var(--muted); }
  tr.child td:first-child { padding-left:28px; } tr.detail[hidden] { display:none; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Repos</h1>
  <p id="roots" class="muted">Scanning…</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search name, path or branch" aria-label="Search repos">
    <span role="group" aria-label="Filter">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="attention" aria-pressed="false">Needs attention</button>
      <button type="button" data-filter="changed" aria-pressed="false">Changed</button>
      <button type="button" data-filter="sync" aria-pressed="false">Sync needed</button>
    </span>
    <label class="muted">Sort <select id="sort" aria-label="Sort">
      <option value="attention">Needs attention first</option><option value="name">Name</option><option value="recent">Last commit</option></select></label>
  </div>
  <div class="bar">
    <button type="button" id="refresh">Refresh</button>
    <button type="button" id="ci">Check GitHub</button>
    <button type="button" id="fetch" title="Runs git fetch --prune in each repo; updates remote-tracking refs only">Fetch all</button>
    <button type="button" id="rescan">Rescan</button>
  </div>
  <p id="status" class="muted" role="status" aria-live="polite"></p>
  <table>
    <caption class="sr">Git repositories and whether each is git-golden</caption>
    <thead><tr><th scope="col">Repo</th><th scope="col">Branch</th><th scope="col">Working tree</th><th scope="col">Sync</th><th scope="col">Last commit</th><th scope="col">Golden</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
"use strict";
const state = { scan: null, rows: new Map(), filter: "all", expanded: new Set(), refreshedAt: 0, busy: false };
const $ = (id) => document.getElementById(id);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "text") el.textContent = v; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids) if (kid != null) el.append(kid);
  return el;
};
const base = (p) => p.split("/").filter(Boolean).pop() || p;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return "never";
  if (s < 60) return "just now";
  for (const [limit, div, unit] of [[3600, 60, "minute"], [86400, 3600, "hour"], [2592000, 86400, "day"], [31536000, 2592000, "month"], [1e12, 31536000, "year"]])
    if (s < limit) return plural(Math.floor(s / div), unit) + " ago";
}
async function api(path, options) {
  const r = await fetch(path, options);
  let body = null; try { body = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error((body && body.error) || `HTTP ${r.status}`); e.code = r.status; throw e; }
  return body;
}
async function pool(items, size, fn) {
  const queue = items.slice();
  await Promise.all(Array.from({ length: Math.min(size, queue.length) }, async () => {
    while (queue.length) await fn(queue.shift());
  }));
}
const say = (text) => { $("status").textContent = text; };

function needsAttention(row) {
  const s = row.status; if (!s) return false;
  if (s.golden.status === "not golden") return true;
  return s.is_worktree && (!s.dirty.is_clean || s.sync.ahead > 0 || s.sync.behind > 0);
}
const isChanged = (row) => !!row.status && !row.status.dirty.is_clean;
const needsSync = (row) => !!row.status && (row.status.sync.ahead > 0 || row.status.sync.behind > 0);

function goldenCell(row) {
  if (row.error) return h("span", { class: "golden bad", text: row.error });
  const s = row.status; if (!s) return h("span", { class: "muted", text: "checking…" });
  const g = s.golden, more = g.reasons.length > 1 ? ` (+${g.reasons.length - 1} more)` : "";
  if (g.status === "golden") return h("span", { class: "golden ok", text: "✓ golden" });
  if (g.status === "not golden") return h("span", { class: "golden bad", text: `✗ not golden: ${g.reasons[0]}${more}` });
  if (g.status === "worktree") return h("span", { class: "muted", text: "worktree" });
  return h("span", { class: "golden warn", text: "golden pending CI", title: g.notes.join("; ") });
}

function detailRows(row, id) {
  const s = row.status, items = [];
  const add = (k, v) => items.push(h("dt", { text: k }), h("dd", {}, v));
  if (!s) { add("Status", row.error || "checking…"); return items; }
  const g = s.golden;
  add("Verdict", g.status + (g.reasons.length ? ": " + g.reasons.join("; ") : g.notes.length ? ": " + g.notes.join("; ") : ""));
  add("Path", h("span", {}, row.checkout.path + " ", h("button", { type: "button", "data-copy": row.checkout.path, text: "Copy" })));
  add("Local branches", s.branches.join(", ") || "none");
  add("Remote branches", s.has_origin ? (s.remote_branches.join(", ") || "none known") : "no origin remote");
  if (s.other_worktrees.length) add("Other worktrees", s.other_worktrees.join(", "));
  add("Last fetch", s.last_fetch_at ? ago(s.last_fetch_at) : "never fetched");
  if (s.github_repo) add("GitHub", s.github_repo + (row.ci ? ` (CI on default branch: ${row.ci.state})` : " (CI not checked)"));
  if (row.fetchError) add("Fetch", row.fetchError);
  return items;
}

function projects() {
  const groups = new Map();
  for (const row of state.rows.values()) {
    const key = row.checkout.project_path;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  }
  return [...groups.values()].map((rows) => {
    rows.sort((a, b) => (a.checkout.is_worktree - b.checkout.is_worktree) || a.checkout.path.localeCompare(b.checkout.path));
    return rows;
  });
}
function matches(row, q) {
  if (q) {
    const s = row.status, hay = [row.checkout.path, s ? s.branch : ""].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (state.filter === "attention") return needsAttention(row);
  if (state.filter === "changed") return isChanged(row);
  if (state.filter === "sync") return needsSync(row);
  return true;
}
function render() {
  const q = $("q").value.trim().toLowerCase(), sort = $("sort").value;
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.toggle : null;
  let groups = projects().filter((rows) => rows.some((r) => matches(r, q)));
  const head = (rows) => rows[0];
  const recent = (rows) => Date.parse((head(rows).status || { last_commit: {} }).last_commit.date) || 0;
  groups.sort((a, b) => {
    if (sort === "attention") { const d = rows_attention(b) - rows_attention(a); if (d) return d; }
    if (sort === "recent") { const d = recent(b) - recent(a); if (d) return d; }
    return head(a).checkout.path.localeCompare(head(b).checkout.path);
  });
  const body = $("rows"); body.replaceChildren();
  let n = 0;
  for (const rows of groups) for (const row of rows) {
    const s = row.status, id = "d" + (++n), child = row.checkout.is_worktree && rows.length > 1;
    const open = state.expanded.has(row.checkout.path);
    const toggle = h("button", { type: "button", class: "toggle", "data-toggle": row.checkout.path, "aria-expanded": String(open), "aria-controls": id, text: base(row.checkout.path) });
    const cells = [
      h("td", { class: "repo" }, toggle, h("span", { class: "path", text: row.checkout.path.replace(/^\/Users\/[^/]+/, "~") })),
      h("td", { "data-label": "Branch", text: s ? s.branch : "" }),
      h("td", { "data-label": "Working tree", text: s ? (s.dirty.is_clean ? "clean" : `${s.dirty.total} changed`) : "" }),
      h("td", { "data-label": "Sync", text: s ? (!s.sync.has_upstream ? "no upstream" : s.sync.ahead || s.sync.behind ? `ahead ${s.sync.ahead} behind ${s.sync.behind}` : "even") : "" }),
      h("td", { "data-label": "Last commit", text: s && s.last_commit.subject ? `${s.last_commit.relative}: ${s.last_commit.subject}` : "" }),
      h("td", { "data-label": "Golden" }, goldenCell(row)),
    ];
    body.append(h("tr", { class: child ? "child" : "" }, ...cells));
    const detail = h("tr", { class: "detail", id, hidden: !open }, h("td", { colspan: "6" }, h("dl", {}, ...detailRows(row, id))));
    body.append(detail);
  }
  if (!groups.length && state.scan) body.append(h("tr", {}, h("td", { colspan: "6", class: "muted", text: state.rows.size ? "No repos match." : "No git repositories found." })));
  const attention = [...state.rows.values()].filter(needsAttention).length;
  document.title = (attention ? `(${attention}) ` : "") + "repo-root-tracker";
  if (focused) { const el = [...document.querySelectorAll("[data-toggle]")].find((b) => b.dataset.toggle === focused); if (el) el.focus(); }
}
const rows_attention = (rows) => rows.some(needsAttention) ? 1 : 0;
let queued = false;
const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };

function rootsLine(scan) {
  const parts = [`Scanned ${scan.roots.map((r) => r.replace(/^\/Users\/[^/]+/, "~")).join(", ")} in ${scan.elapsed_seconds}s`];
  if (scan.missing_roots.length) parts.push(`missing: ${scan.missing_roots.join(", ")}`);
  if (scan.truncated) parts.push(`SCAN INCOMPLETE (${scan.truncated_reason}), so some repos may be missing`);
  else if (scan.deeper_not_searched) parts.push(`${plural(scan.deeper_not_searched, "folder")} deeper than ${scan.max_depth} levels not searched`);
  $("roots").textContent = parts.join(". ") + ".";
}
async function loadStatus(row) {
  try { row.status = await api("/api/repos/status?path=" + encodeURIComponent(row.checkout.path)); row.error = ""; }
  catch (e) { row.status = null; row.error = e.code === 410 ? "gone from disk" : "error: " + e.message; }
  schedule();
}
async function load(scan) {
  state.scan = scan; rootsLine(scan);
  const next = new Map();
  for (const c of scan.checkouts) next.set(c.path, state.rows.get(c.path) || { checkout: c, status: null, error: "", ci: null, fetchError: "" });
  state.rows = next; render();
  say(`Checking ${plural(next.size, "checkout")}…`);
  await pool([...next.values()], 6, loadStatus);
  state.refreshedAt = Date.now();
  say(`${plural(next.size, "checkout")} checked ${new Date().toLocaleTimeString()}.`);
}
async function busy(label, work) {
  if (state.busy) return; state.busy = true;
  document.querySelectorAll(".bar button").forEach((b) => { b.disabled = true; });
  try { await work(); } catch (e) { say(`${label} failed: ${e.message}`); }
  finally { state.busy = false; document.querySelectorAll(".bar button").forEach((b) => { b.disabled = false; }); }
}
const refresh = () => busy("Refresh", async () => { await pool([...state.rows.values()], 6, loadStatus); state.refreshedAt = Date.now(); say(`Refreshed ${new Date().toLocaleTimeString()}.`); });
const rescan = () => busy("Rescan", async () => load(await api("/api/scan", { method: "POST" })));
const targets = (pred) => [...state.rows.values()].filter((r) => !r.checkout.is_worktree && r.status && pred(r.status));
function checkGithub() {
  return busy("Check GitHub", async () => {
    const list = targets((s) => s.github_repo); let done = 0, failed = 0;
    await pool(list, 4, async (row) => {
      try { row.ci = (await api("/api/ci?path=" + encodeURIComponent(row.checkout.path) + "&refresh=1")).ci; await loadStatus(row); }
      catch (e) { failed++; }
      say(`Checking GitHub ${++done}/${list.length}…`);
    });
    say(`GitHub checked for ${plural(list.length - failed, "repo")}${failed ? `, ${failed} failed` : ""}.`);
  });
}
function fetchAll() {
  return busy("Fetch", async () => {
    const list = targets((s) => s.has_origin); let done = 0, failed = 0;
    await pool(list, 4, async (row) => {
      try { row.status = await api("/api/fetch?path=" + encodeURIComponent(row.checkout.path), { method: "POST" }); row.fetchError = ""; }
      catch (e) { failed++; row.fetchError = e.message; }
      say(`Fetching ${++done}/${list.length}…`); schedule();
    });
    say(`Fetched ${plural(list.length - failed, "repo")}${failed ? `; ${failed} failed (see each row)` : ""}.`);
  });
}

$("q").addEventListener("input", schedule);
$("sort").addEventListener("change", schedule);
$("refresh").addEventListener("click", refresh);
$("rescan").addEventListener("click", rescan);
$("ci").addEventListener("click", checkGithub);
$("fetch").addEventListener("click", fetchAll);
document.querySelector('[aria-label="Filter"]').addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]"); if (!b) return;
  state.filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  schedule();
});
$("rows").addEventListener("click", (e) => {
  const copy = e.target.closest("[data-copy]");
  if (copy) { navigator.clipboard.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Copy failed"; }); return; }
  const t = e.target.closest("[data-toggle]"); if (!t) return;
  const p = t.dataset.toggle; state.expanded.has(p) ? state.expanded.delete(p) : state.expanded.add(p); render();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.rows.size && Date.now() - state.refreshedAt > 60000) refresh();
});
api("/api/scan").then(load).catch((e) => { $("roots").textContent = "Could not scan: " + e.message; });
</script>
</body>
</html>
