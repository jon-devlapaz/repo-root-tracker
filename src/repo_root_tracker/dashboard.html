<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>repo-root-tracker</title>
<style>

@media (prefers-color-scheme: dark) { :root {
  --bg:#111315; --fg:#e8eaec; --muted:#9aa2ab; --line:#272b30; --edge:#6e757d; --soft:#1a1d20; --hover:#171a1d;
  --ok:#5fcf8a; --ok-bg:#15301f; --warn:#e5b95a; --warn-bg:#33290f; --bad:#ff8f8a; --bad-bg:#3a1c1b; --link:#6cb0ff; } }
* { box-sizing:border-box; }

::selection { background:var(--ok-bg); color:var(--fg); }
.top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
.actions { display:flex; flex-wrap:wrap; gap:6px; }
button, input, select { font:inherit; color:inherit; }
.btn { background:transparent; border:1px solid var(--edge); border-radius:6px; padding:4px 10px; cursor:pointer; }
.btn:hover { background:var(--hover); } .btn:disabled { opacity:.5; cursor:default; }

.chips { display:flex; flex-wrap:wrap; gap:4px; }
.chip { background:transparent; border:1px solid transparent; border-radius:6px; padding:3px 9px; cursor:pointer; color:var(--muted); }
.chip b { color:var(--fg); font-weight:650; margin-left:4px; }
.chip:hover { background:var(--hover); } .chip[aria-pressed=true] { background:var(--soft); border-color:var(--edge); color:var(--fg); }

.clear[hidden] { display:none; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:7px 10px; vertical-align:middle; overflow-wrap:anywhere; }
thead th { font-size:12px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line); }
tbody.group > tr.title th { padding:18px 10px 6px; font-size:12px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); font-weight:650; }
tbody.group > tr.title th span { color:var(--fg); margin-left:6px; }
tbody.group > tr.title .btn { margin-left:10px; padding:1px 8px; font-size:12px; text-transform:none; letter-spacing:0; }
tr.row td { border-top:1px solid var(--line); } tr.row:hover td { background:var(--hover); }
tr.row.open td { background:var(--soft); }
tr.child td:first-child { padding-left:30px; }
.name { display:inline-flex; align-items:center; gap:6px; min-height:28px; font-weight:600; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
.parent { color:var(--muted); font-size:12px; display:block; padding-left:46px; margin-top:-4px; }
.muted { color:var(--muted); }
td.when { white-space:nowrap; } td.branchcell { overflow-wrap:break-word; word-break:normal; }
.branch.deviates { color:var(--bad); font-weight:600; }
.state { display:inline-flex; flex:none; } .state .i { width:16px; height:16px; }
.state[data-state=golden] { color:var(--ok); } .state[data-state=pending] { color:var(--warn); }
.state[data-state=bad] { color:var(--bad); } .state[data-state=quiet], .state[data-state=checking] { color:var(--muted); }
.i { width:14px; height:14px; flex:none; }

.tag { border:1px solid var(--line); border-radius:5px; padding:0 6px; font-size:13px; white-space:nowrap; }
.tag.hot { border-color:var(--bad); color:var(--bad); }

.todo li { display:contents; } .todo .what { padding:3px 0; }
.todo code, .path { font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }

@media (max-width:720px) {

  tr.row td { display:block; border:0; padding:1px 10px; } tr.row td.repo { grid-column:1 / -1; }
  td.repo { grid-row:1; }
  td.branchcell { grid-row:2; grid-column:1; font-size:13px; } td.when { grid-row:2; grid-column:2; text-align:right; font-size:13px; }
  td.tagscell { grid-row:3; grid-column:1 / -1; padding-bottom:4px; } td.tagscell:empty, td.tagscell .tags:empty { padding:0; }
  .name { min-height:44px; } .parent { padding-left:46px; margin-top:-10px; }
  tr.child td:first-child { padding-left:26px; }
  tr.detail { display:block; width:100%; } tr.detail[hidden] { display:none; } tr.detail td { display:block; padding-left:12px; }
  input[type=search] { max-width:none; margin-left:0; } .chip { padding:3px 7px; }
}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-branch" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>

</svg>
<main>
  <div class="top">
    <h1>Repos</h1>
    <div class="actions">
      <button type="button" class="btn" id="refresh" title="Re-read local git state">Refresh</button>
      <button type="button" class="btn" id="fetch" title="git fetch --prune in each repo: updates remote-tracking refs only">Fetch</button>
      <button type="button" class="btn" id="ci" title="Ask gh for the CI result on each default branch">GitHub</button>
      <button type="button" class="btn" id="rescan" title="Look for repos again">Rescan</button>
    </div>
  </div>
  <div class="filters">
    <div class="chips" role="group" aria-label="Filter">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All<b id="n-all">0</b></button>
      <button type="button" class="chip" data-filter="bad" aria-pressed="false">Needs work<b id="n-bad">0</b></button>
      <button type="button" class="chip" data-filter="pending" aria-pressed="false">Pending CI<b id="n-pending">0</b></button>
      <button type="button" class="chip" data-filter="golden" aria-pressed="false">Golden<b id="n-golden">0</b></button>
    </div>
    <select id="sort" aria-label="Sort"><option value="clean">Closest to clean</option><option value="name">Name</option><option value="recent">Last commit</option></select>
    <input id="q" type="search" placeholder="Search" aria-label="Search repos">
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="clear" class="clear" hidden><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Everything is clean.</div>
  <table id="rows">
    <caption class="sr">Git repositories grouped by whether each is git-golden</caption>
    <thead><tr><th scope="col">Repo</th><th scope="col">Branch</th><th scope="col">Outstanding</th><th scope="col">Last commit</th></tr></thead>
  </table>
  <footer id="roots">Scanning…</footer>
</main>
<script>
"use strict";
const state = { scan: null, rows: new Map(), filter: "all", expanded: new Set(), refreshedAt: 0, busy: false, autoCI: false };
const GROUPS = [["checking", "Checking"], ["bad", "Needs work"], ["pending", "Pending CI"], ["golden", "Golden"]];
const LABEL = { golden: "Golden", pending: "Pending CI", bad: "Needs work", quiet: "Worktree", checking: "Checking" };
const SYMBOL = { golden: "check", pending: "clock", bad: "alert", quiet: "branch", checking: "clock" };
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "text") el.textContent = v; else el.setAttribute(k, v === true ? "" : v);

  for (const kid of kids) if (kid != null) el.append(kid);
  return el;
};
const icon = (name, cls) => { const s = document.createElementNS(SVGNS, "svg"); s.setAttribute("class", "i " + (cls || "")); s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS(SVGNS, "use"); u.setAttribute("href", "#i-" + name); s.append(u); return s; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const home = (p) => p.replace(/^\/Users\/[^/]+/, "~");
const base = (p) => p.split("/").filter(Boolean).pop() || p;
const clock = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function relPath(path) {
  for (const root of (state.scan ? state.scan.roots : [])) if (path.startsWith(root + "/")) return path.slice(root.length + 1);

}
function ago(iso) {

}
const q = (s) => /^[\w@%+=:,./-]+$/.test(s) ? s : "'" + s.replace(/'/g, "'\\''") + "'";
// Every copied command names its repository, so pasting it into the wrong terminal cannot touch another repo.
const git = (row, args) => `git -C ${q(row.status.path)} ${args}`;
async function api(path, options) {
  const r = await fetch(path, options);
  let body = null; try { body = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error((body && body.error) || `HTTP ${r.status}`); e.code = r.status; throw e; }
  return body;
}
async function pool(items, size, fn) {
  const queue = items.slice();
  await Promise.all(Array.from({ length: Math.min(size, queue.length) }, async () => { while (queue.length) await fn(queue.shift()); }));
}
const say = (text) => { $("status").textContent = text; };

function tone(row) {
  if (row.error) return "bad";
  const s = row.status; if (!s) return "checking";
  return { "golden": "golden", "golden pending CI": "pending", "not golden": "bad", "worktree": "quiet" }[s.golden.status];
}
const outstanding = (row) => (row.status ? row.status.golden.items.length : row.error ? 1 : 0);
const worktreeNeedsWork = (row) => !!row.status && (!row.status.dirty.is_clean || row.status.sync.ahead > 0 || row.status.sync.behind > 0);
function groupTone(rows) {
  const main = rows.find((r) => !r.checkout.is_worktree);
  if (main) return tone(main) === "quiet" ? "golden" : tone(main);
  const first = rows[0];  // a project with no main checkout of its own (a bare repository): judged by its worktree
  if (first.error || worktreeNeedsWork(first)) return "bad";
  return first.status ? "golden" : "checking";
}

function stateIcon(row) {
  const t = tone(row), label = row.error || LABEL[t];
  return h("span", { class: "state", "data-state": t, title: label }, icon(SYMBOL[t]), h("span", { class: "sr", text: label + ": " }));
}
function tags(row) {
  const wrap = h("span", { class: "tags" });
  if (row.error) { wrap.append(h("span", { class: "tag hot", text: row.error })); return wrap; }
  const s = row.status; if (!s) return wrap;
  for (const it of s.golden.items) {
    if (it.kind === "branch") continue;  // the Branch column already shows it, in red
    const t = h("span", { class: "tag" + (it.kind === "ci" ? " hot" : ""), text: it.label });
    if (it.kind === "sync") t.setAttribute("aria-label", it.label.replace("↑", "ahead ").replace("↓", "behind "));

  if (s.is_worktree) {
    if (!s.dirty.is_clean) wrap.append(h("span", { class: "tag", text: plural(s.dirty.total, "change") }));
    if (s.sync.ahead || s.sync.behind) wrap.append(h("span", { class: "tag", text: [s.sync.ahead ? "↑" + s.sync.ahead : "", s.sync.behind ? "↓" + s.sync.behind : ""].filter(Boolean).join(" ") }));
  }
  return wrap;
}

function commandRow(what, cmd, note) {
  const li = h("li", {});
  li.append(h("div", { class: "what" }, what, cmd ? h("code", { text: cmd }) : null, note ? h("div", { class: "note", text: note }) : null));
  li.append(cmd ? h("button", { type: "button", class: "btn", "data-copy": cmd, text: "Copy" }) : h("span"));
  return li;
}
function branchLines(row, scope) {
  const s = row.status, list = s.branch_details.filter((d) => d.scope === scope);
  const merged = list.filter((d) => d.merged === true), other = list.filter((d) => d.merged !== true);
  const holder = h("div", {});
  for (const d of other) {
    const verdict = d.merged === false ? h("span", { class: "warn", text: plural(d.unmerged, "commit") + " not on main" })
      : h("span", { class: "muted", text: "cannot tell if merged" });
    holder.append(h("div", { class: "branchrow" }, h("span", { text: d.name }), verdict, h("span", { class: "muted", text: d.relative })));
  }
  if (merged.length) holder.append(h("div", { class: "branchrow" }, h("span", { class: "ok", text: `${merged.length} merged, safe to delete:` }), h("span", { text: merged.map((d) => d.name).join(", ") })));
  return { list, merged, other, holder };

function remoteBranches(row) {

    const name = d.name.replace(/^origin\//, "");

  });
  const total = s.branch_details_total;
  const notes = [`Judged from the last fetch (${s.last_fetch_at ? ago(s.last_fetch_at) : "never fetched"}). A delete is refused if the branch has moved since.`];
  if (other.length) notes.push("Unmerged can still be squash-merged; git cannot tell, so check the pull request.");
  return commandRow(h("span", {}, h("strong", { text: plural(list.length, "remote branch").replace("branchs", "branches") + " besides main" }), holder), cmds.join("\n"), notes.join(" "));
}
function localBranches(row) {
  const { list, merged, other, holder } = branchLines(row, "local");
  if (!list.length) return [];

  const out = [commandRow(h("span", {}, h("strong", { text: plural(list.length, "local branch").replace("branchs", "branches") + " besides main" }), holder),
    byAncestor.length ? git(row, "branch -d " + byAncestor.map(q).join(" ")) : "",
    other.length ? "Unmerged can still be squash-merged; git cannot tell, so check the pull request." : null)];

  return out;
}
function detailItems(row) {
  const s = row.status, ul = h("ul", { class: "todo" }), item = (el) => { if (el) ul.append(el); };
  const total = s.branch_details_total, shown = s.branch_details.length;
  for (const it of s.golden.items) {
    if (it.kind === "branch") item(s.branch === "(no commits)" ? commandRow("No commits yet", null) : commandRow(`On ${s.branch}, not main`, git(row, "switch main")));
    else if (it.kind === "changes") item(commandRow(plural(s.dirty.total, "uncommitted change"), git(row, "status"), "Commit, stash or discard them."));
    else if (it.kind === "local-branches") localBranches(row).forEach(item);
    else if (it.kind === "remote-branches") item(remoteBranches(row));
    else if (it.kind === "worktrees") for (const w of s.other_worktrees) item(commandRow("Extra worktree " + home(w), git(row, "worktree remove " + q(w))));

      const m = s.main_sync, both = m.ahead && m.behind;

    else if (it.kind === "not-fetched") item(commandRow("origin/main not known yet", null, "Use Fetch."));
    else if (it.kind === "no-origin-main") item(commandRow("origin has no main branch; its default is something else", null, "Rename the default branch to main on GitHub, or this repo can never be golden."));

function detailRow(row) {
  const s = row.status, box = h("div", {});

function projects() {

    groups.get(key).push(row);

function matches(row, text) {
  if (!text) return true;
  const s = row.status;
  return [row.checkout.path, s ? s.branch : ""].join(" ").toLowerCase().includes(text);
}
function render() {
  const text = $("q").value.trim().toLowerCase(), sort = $("sort").value;
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.toggle : null;
  const all = projects(), counts = { all: all.length, checking: 0, bad: 0, pending: 0, golden: 0 };
  for (const rows of all) counts[groupTone(rows)]++;
  for (const k of ["all", "bad", "pending", "golden"]) $("n-" + k).textContent = counts[k];
  $("clear").hidden = !(state.rows.size && counts.checking === 0 && counts.bad === 0 && counts.pending === 0);
  const head = (rows) => rows[0];
  const recent = (rows) => (head(rows).status && Date.parse(head(rows).status.last_commit.date)) || 0;
  const order = (a, b) => (sort === "recent" ? recent(b) - recent(a) : sort === "clean" ? outstanding(head(a)) - outstanding(head(b)) : 0)
    || head(a).checkout.path.localeCompare(head(b).checkout.path);
  const body = $("rows"); body.querySelectorAll(":scope > tbody").forEach((el) => el.remove());
  let n = 0, shown = 0;
  for (const [key, label] of GROUPS) {
    if (state.filter !== "all" && state.filter !== key) continue;
    const members = all.filter((rows) => groupTone(rows) === key && rows.some((r) => matches(r, text))).sort(order);
    if (!members.length) continue;
    const tbody = h("tbody", { class: "group" }, h("tr", { class: "title" }, h("th", { colspan: "4", scope: "rowgroup" }, label, h("span", { text: String(members.length) }),
      key === "pending" ? h("button", { type: "button", class: "btn", "data-action": "ci", title: "Ask gh for the CI result on each default branch", text: "Check CI", disabled: state.scan.writable === false }) : null)));
    for (const rows of members) for (const row of rows) {
      shown++;
      const s = row.status, id = "d" + (++n), child = row.checkout.is_worktree && rows.length > 1, open = state.expanded.has(row.checkout.path);
      const rel = relPath(row.checkout.path), slash = rel.lastIndexOf("/");
      const deviates = s && s.branch !== "main" && !s.is_worktree;
      const toggle = h("button", { type: "button", class: "name", "data-toggle": row.checkout.path, "aria-expanded": String(open), "aria-controls": id },
        icon("chev", "chev"), stateIcon(row), h("span", { class: "rname", text: base(row.checkout.path) }));
      tbody.append(h("tr", { class: "row" + (child ? " child" : "") + (open ? " open" : "") },
        h("td", { class: "repo" }, toggle, slash > 0 ? h("span", { class: "parent", text: rel.slice(0, slash) }) : null),
        h("td", { class: "branchcell" }, h("span", { class: "branch" + (deviates ? " deviates" : " muted"), text: s ? s.branch : "" })),
        h("td", { class: "tagscell" }, tags(row)),
        h("td", { class: "muted when", text: s && s.last_commit.relative ? s.last_commit.relative : "", title: s ? s.last_commit.subject : "" })));
      tbody.append(h("tr", { class: "detail", id, hidden: !open }, h("td", { colspan: "4" }, open ? detailRow(row) : null)));
    }
    body.append(tbody);
  }
  if (!shown && state.scan) body.append(h("tbody", {}, h("tr", {}, h("td", { colspan: "4", class: "muted", text: state.rows.size ? "No repos match." : "No git repositories found." }))));
  document.title = (counts.bad ? `(${counts.bad}) ` : "") + "repo-root-tracker";
  if (focused) { const el = [...document.querySelectorAll("[data-toggle]")].find((b) => b.dataset.toggle === focused); if (el) el.focus(); }
}
let queued = false;
const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(); }); } };

function lockWrites(scan) {
  const locked = scan.writable === false;
  for (const id of ["fetch", "rescan", "ci"]) {
    const b = $(id); b.dataset.locked = locked ? "1" : ""; b.disabled = locked;
    if (locked) b.title = "Only works on the computer running repo-root-tracker";
  }
}
function rootsLine(scan) {
  lockWrites(scan);
  const parts = [`Scanned ${scan.roots.map(home).join(", ")} in ${scan.elapsed_seconds}s`];
  if (scan.writable === false) parts.push("Read-only on this device: Fetch, Rescan and GitHub checks work on the computer running this");
  if (scan.missing_roots.length) parts.push(`missing: ${scan.missing_roots.map(home).join(", ")}`);
  if (scan.truncated) parts.push(`SCAN INCOMPLETE (${scan.truncated_reason}), so some repos may be missing`);
  else if (scan.deeper_not_searched) parts.push(`${plural(scan.deeper_not_searched, "folder")} deeper than ${scan.max_depth} levels not searched`);
  $("roots").textContent = parts.join(". ") + ".";
}
async function loadStatus(row) {
  try { row.status = await api("/api/repos/status?path=" + encodeURIComponent(row.checkout.path)); row.error = ""; if (row.status.ci) row.ci = row.status.ci; }
  catch (e) { row.status = null; row.error = e.code === 410 ? "Gone from disk" : "Error: " + e.message; }
  schedule();
}
function summary() {
  const all = projects(), wt = all.reduce((n, rows) => n + rows.filter((r) => r.checkout.is_worktree).length, 0);
  return `${plural(all.length, "repo")}${wt ? `, ${plural(wt, "worktree")}` : ""}, checked ${clock()}`;
}
async function load(scan) {
  state.scan = scan; rootsLine(scan);
  const next = new Map();
  for (const c of scan.checkouts) next.set(c.path, state.rows.get(c.path) || { checkout: c, status: null, error: "", ci: null, fetchError: "" });
  state.rows = next; render();
  say(`Checking ${plural(next.size, "checkout")}…`);
  await pool([...next.values()], 6, loadStatus);
  state.refreshedAt = Date.now(); render();
  say(summary());
  if (scan.auto_ci && scan.writable !== false && !state.autoCI) { state.autoCI = true; checkGithub(true); }
}
async function busy(label, work) {
  if (state.busy) return; state.busy = true;
  document.querySelectorAll(".actions button, [data-action]").forEach((b) => { b.disabled = true; });
  try { await work(); } catch (e) { say(`${label} failed: ${e.message}`); }
  finally { state.busy = false; document.querySelectorAll(".actions button").forEach((b) => { b.disabled = !!b.dataset.locked; }); schedule(); }
}
const refresh = () => busy("Refresh", async () => { await pool([...state.rows.values()], 6, loadStatus); state.refreshedAt = Date.now(); say(`Refreshed ${clock()}`); });
const rescan = () => busy("Rescan", async () => load(await api("/api/scan", { method: "POST" })));
const targets = (pred) => [...state.rows.values()].filter((r) => !r.checkout.is_worktree && r.status && pred(r.status));
// `onlyClean` is the automatic check after load: ask GitHub only about repos that are otherwise clean, so a repo that
// already needs work is not sent over the network just to be told what we already know.
function checkGithub(onlyClean) {
  return busy("GitHub check", async () => {
    const list = targets((s) => s.github_repo && (onlyClean !== true || s.golden.status === "golden pending CI")); let done = 0, failed = 0;
    if (!list.length) { say(summary()); return; }
    await pool(list, 4, async (row) => {
      try { row.ci = (await api("/api/ci?path=" + encodeURIComponent(row.checkout.path) + "&refresh=1")).ci; await loadStatus(row); }
      catch (e) { failed++; }
      say(`Checking CI ${++done}/${list.length}…`);
    });
    say(`GitHub checked for ${plural(list.length - failed, "repo")}${failed ? `, ${failed} failed` : ""}`);
  });
}
function fetchAll() {
  return busy("Fetch", async () => {
    const list = targets((s) => s.has_origin); let done = 0, failed = 0;
    await pool(list, 4, async (row) => {
      try { row.status = await api("/api/fetch?path=" + encodeURIComponent(row.checkout.path), { method: "POST" }); row.fetchError = ""; }
      catch (e) { failed++; row.fetchError = e.message; }
      say(`Fetching ${++done}/${list.length}…`); schedule();
    });
    say(`Fetched ${plural(list.length - failed, "repo")}${failed ? `, ${failed} failed (open the row)` : ""}`);
  });
}

$("q").addEventListener("input", schedule);
$("sort").addEventListener("change", schedule);
$("refresh").addEventListener("click", refresh);
$("rescan").addEventListener("click", rescan);
$("ci").addEventListener("click", () => checkGithub());
$("fetch").addEventListener("click", fetchAll);
document.querySelector('[aria-label="Filter"]').addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]"); if (!b) return;
  state.filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  schedule();
});
$("rows").addEventListener("click", (e) => {
  if (e.target.closest("[data-action=ci]")) { checkGithub(); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) { navigator.clipboard.writeText(copy.dataset.copy).then(() => { copy.textContent = "Copied"; }, () => { copy.textContent = "Copy failed"; }); return; }
  const t = e.target.closest("[data-toggle]"); if (!t) return;
  const p = t.dataset.toggle; state.expanded.has(p) ? state.expanded.delete(p) : state.expanded.add(p); render();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.rows.size && Date.now() - state.refreshedAt > 60000) refresh();
});
api("/api/scan").then(load).catch((e) => { $("roots").textContent = "Could not scan: " + e.message; });
</script>
</body>
</html>
