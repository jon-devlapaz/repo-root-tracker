<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>repo-root-tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #58a6ff;
    --accent-dim: #1f6feb;
    --green: #3fb950;
    --green-bg: rgba(63,185,80,.13);
    --red: #f85149;
    --red-text: #ff7b72;
    --red-bg: rgba(248,81,73,.13);
    --yellow: #d29922;
    --yellow-bg: rgba(210,153,34,.13);
    --purple: #bc8cff;
    --cyan: #39c5cf;
    --text: #e6edf3;
    --body: #c9d1d9;
    --muted: #8b949e;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    --lane-0: #58a6ff; --lane-1: #3fb950; --lane-2: #d29922;
    --lane-3: #f85149; --lane-4: #bc8cff; --lane-5: #39c5cf;
  }

  body {
    background: var(--bg);
    color: var(--body);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  header svg { flex-shrink: 0; }

  .header-text h1 { font-size: 14px; font-weight: 600; color: var(--text); }
  .header-text p { font-size: 12px; color: var(--muted); }

  .badge {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 12px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--muted);
  }
  .kbd-hint { font-size: 12px; color: var(--muted); }
  .kbd-hint kbd { margin: 0 2px; }

  main { max-width: 900px; margin: 0 auto; padding: 24px; }

  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .add-form input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
  }
  .add-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
  .add-form input::placeholder { color: var(--muted); }

  .btn {
    background: var(--accent-dim);
    border: 1px solid rgba(240,246,252,.1);
    border-radius: 6px;
    padding: 7px 16px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .btn-ghost {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--body);
    padding: 5px 12px;
    font-size: 12px;
  }
  .btn-ghost:hover { border-color: var(--muted); background: var(--border); }
  .btn-danger:hover { color: var(--red-text); border-color: var(--red); }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-header h2 {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted);
  }

  /* ---- Repo cards ---- */
  .repo-list { display: flex; flex-direction: column; gap: 8px; }

  .repo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color .12s;
  }
  .repo-card:hover { border-color: var(--accent); }

  .repo-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-ok { background: var(--green); }
  .status-dirty { background: var(--yellow); }
  .status-missing { background: var(--red); }
  .status-unknown { background: var(--muted); }

  .repo-body { flex: 1; min-width: 0; }
  .repo-path {
    font-family: var(--mono); font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .repo-path .home { color: var(--muted); }
  .repo-meta {
    margin-top: 3px; font-size: 12px; color: var(--muted);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .repo-meta .branch {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 8px;
    font-family: var(--mono); font-size: 11px; color: var(--accent);
  }
  .repo-meta .rel { font-size: 11px; }
  .repo-subject {
    margin-top: 2px; font-size: 12px; color: var(--body);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .repo-label { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .repo-label.stale { color: var(--yellow); }
  .repo-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty svg { margin: 0 auto 12px; opacity: .35; display: block; }
  .empty p { font-size: 13px; }

  /* ---- Detail view ---- */
  #back-btn { margin-bottom: 12px; }
  #detail-header h2 {
    font-family: var(--mono); font-size: 17px; font-weight: 600;
    color: var(--text); word-break: break-all;
  }
  #detail-header .sub { font-size: 12px; color: var(--muted); margin: 4px 0 16px; }
  #detail-header .sub strong { color: var(--accent); font-weight: 600; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .tab {
    background: transparent; border: none;
    color: var(--muted); font-size: 13px; font-weight: 500;
    padding: 8px 14px; cursor: pointer; font-family: var(--font);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count-pill {
    background: var(--yellow-bg); color: var(--yellow);
    border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 600;
  }

  /* Commits */
  .commit-row {
    display: flex; gap: 4px; align-items: stretch;
    border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 4px; cursor: pointer;
    background: var(--surface);
    transition: border-color .12s;
  }
  .commit-row:hover { border-color: var(--muted); }
  .commit-row.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .commit-graph { flex-shrink: 0; display: flex; align-items: stretch; padding: 6px 2px 6px 8px; }

  .commit-body { flex: 1; min-width: 0; padding: 8px 12px 8px 4px; }
  .commit-top { display: flex; align-items: baseline; gap: 8px; }
  .commit-subject {
    font-size: 13px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .commit-row.merge .commit-subject { color: var(--purple); }
  .commit-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .avatar {
    width: 20px; height: 20px; border-radius: 50%;
    font-size: 10px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    color: #0d1117; flex-shrink: 0;
  }
  .commit-hash {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    cursor: pointer; border-radius: 4px; padding: 1px 4px;
  }
  .commit-hash:hover { color: var(--accent); background: var(--surface2); }
  .commit-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .commit-meta .author { color: var(--body); }
  .commit-tags { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .tag-branch {
    background: rgba(88,166,255,.13); border: 1px solid rgba(88,166,255,.4);
    color: var(--accent); border-radius: 10px;
    font-size: 10px; padding: 0 8px; font-family: var(--mono);
  }

  /* Diffs */
  .diff-box {
    margin-top: 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    overflow: auto; max-height: 480px;
  }
  .diff-box pre {
    font-family: var(--mono); font-size: 12px; line-height: 1.5;
    padding: 8px 0; white-space: pre;
  }
  .diff-box .dl { display: block; padding: 0 12px; }
  .diff-add { color: var(--green); background: var(--green-bg); }
  .diff-add .w { background: rgba(63,185,80,.35); border-radius: 2px; }
  .diff-del { color: var(--red-text); background: var(--red-bg); }
  .diff-del .w { background: rgba(248,81,73,.35); border-radius: 2px; }
  .diff-hunk { color: var(--accent); background: rgba(88,166,255,.08); }
  .diff-head { color: var(--muted); }
  .diff-ctx { color: var(--body); }
  .diff-file-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px;
    position: sticky; top: 0;
  }
  .diff-file-head .fname { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .diff-file-head .fstat { flex-shrink: 0; margin-left: 12px; }
  .fstat .a { color: var(--green); } .fstat .d { color: var(--red-text); }

  /* Files & branches */
  .file-row {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 4px;
    cursor: pointer; background: var(--surface);
  }
  .file-row:hover { border-color: var(--muted); }
  .file-row .fname { flex: 1; font-family: var(--mono); font-size: 12px; word-break: break-all; color: var(--text); }
  .file-badge {
    font-size: 10px; font-weight: 600; border-radius: 10px; padding: 1px 8px;
    text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0;
  }
  .badge-staged { background: rgba(88,166,255,.15); color: var(--accent); }
  .badge-unstaged { background: var(--yellow-bg); color: var(--yellow); }
  .badge-untracked { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  .branch-row {
    display: flex; gap: 10px; align-items: center;
    padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 4px; background: var(--surface);
  }
  .branch-row.current { border-color: rgba(63,185,80,.5); }
  .branch-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .branch-row .bname { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); }
  .branch-row .bmeta { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
  .branch-row .bstale { color: var(--yellow); }
  .branch-row.remote { border-left: 2px solid var(--purple); }
  .tag-remote {
    background: rgba(188,140,255,.13); border: 1px solid rgba(188,140,255,.4);
    color: var(--purple); border-radius: 10px;
    font-size: 10px; padding: 0 8px; font-family: var(--mono); font-weight: 400;
  }
  .branch-group {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
    margin: 12px 0 6px;
  }
  .branch-group:first-child { margin-top: 0; }

  /* ---- GitHub tab ---- */
  .gh-section-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted);
    margin: 12px 0 6px;
  }
  .gh-section-title:first-child { margin-top: 0; }
  .pr-row, .issue-row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 4px; background: var(--surface);
  }
  .pr-row:hover, .issue-row:hover { border-color: var(--muted); }
  .ci-badge {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }
  .ci-pass { background: var(--green-bg); color: var(--green); border: 1px solid rgba(63,185,80,.4); }
  .ci-fail { background: var(--red-bg); color: var(--red-text); border: 1px solid rgba(248,81,73,.4); }
  .ci-pending { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(210,153,34,.4); }
  .ci-none { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .pr-body, .issue-body { flex: 1; min-width: 0; }
  .pr-title, .issue-title { font-size: 13px; color: var(--text); }
  .pr-title a, .issue-title a { color: inherit; text-decoration: none; }
  .pr-title a:hover, .issue-title a:hover { color: var(--accent); text-decoration: underline; }
  .pr-meta { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }
  .pr-num {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    flex-shrink: 0; margin-top: 2px;
  }
  .ext-link { color: var(--muted); font-size: 12px; flex-shrink: 0; margin-top: 1px; }
  a.ext-link:hover { color: var(--accent); }

  /* Command palette */
  #palette-overlay {
    position: fixed; inset: 0; background: rgba(1,4,9,.7);
    z-index: 200; display: none;
    padding-top: 15vh;
  }
  #palette-overlay.open { display: block; }
  #palette {
    max-width: 560px; margin: 0 auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 16px 48px rgba(1,4,9,.6);
  }
  #palette-input {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid var(--border);
    padding: 14px 16px; font-size: 14px; color: var(--text);
    outline: none; font-family: var(--font);
  }
  #palette-list { max-height: 320px; overflow-y: auto; padding: 6px; }
  .palette-item {
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 13px; color: var(--body);
    display: flex; gap: 10px; align-items: center;
  }
  .palette-item.active { background: var(--accent-dim); color: #fff; }
  .palette-item .match { color: var(--accent); font-weight: 700; }
  .palette-item.active .match { color: #fff; }
  .palette-hint { padding: 8px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 18px; font-size: 13px;
    pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 300;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--red); color: var(--red-text); }
  .toast.success { border-color: var(--green); color: var(--green); }

  .spinner {
    display: inline-block; width: 13px; height: 13px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; } }
  .repo-card, .commit-row { animation: fadeIn .18s ease; }
</style>
</head>
<body>

<header>
  <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="7" fill="#21262d" stroke="#30363d"/>
    <circle cx="14" cy="10" r="3" stroke="#58a6ff" stroke-width="1.5"/>
    <path d="M14 13v5" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M9 21c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="20" r="2" fill="#3fb950"/>
    <circle cx="20" cy="20" r="2" fill="#3fb950"/>
  </svg>
  <div class="header-text">
    <h1>repo-root-tracker</h1>
  </div>
  <span class="badge" id="count-badge">— repos</span>
  <span class="kbd-hint"><kbd>⌘K</kbd> jump to repo</span>
</header>

<main id="list-view">
  <div class="add-form">
    <input id="path-input" type="text" placeholder="/Users/you/dev/myproject  or  ~/dev/myproject" autocomplete="off" spellcheck="false">
    <button class="btn" id="add-btn" onclick="addRepo()">Add repo</button>
  </div>

  <div class="section-header">
    <h2>Tracked repositories</h2>
    <button class="btn btn-ghost" onclick="revalidateAll()">Re-validate all</button>
  </div>

  <div class="repo-list" id="repo-list"></div>
</main>

<main id="detail-view" style="display:none">
  <button class="btn btn-ghost" id="back-btn" onclick="closeDetail()">← All repos</button>
  <div id="detail-header"></div>
  <div class="tabs">
    <button class="tab active" data-tab="commits" onclick="switchTab('commits')">Commits</button>
    <button class="tab" data-tab="changes" onclick="switchTab('changes')">Changes <span id="changes-count"></span></button>
    <button class="tab" data-tab="branches" onclick="switchTab('branches')">Branches</button>
    <button class="tab" data-tab="github" onclick="switchTab('github')">GitHub <span id="github-count"></span></button>
  </div>
  <div id="tab-commits" class="tab-pane"></div>
  <div id="tab-changes" class="tab-pane" style="display:none"></div>
  <div id="tab-branches" class="tab-pane" style="display:none"></div>
  <div id="tab-github" class="tab-pane" style="display:none"></div>
</main>

<div id="palette-overlay" onclick="if(event.target===this)closePalette()">
  <div id="palette">
    <input id="palette-input" placeholder="Type to jump to a repo…" autocomplete="off" spellcheck="false">
    <div id="palette-list"></div>
    <div class="palette-hint"><kbd>↑↓</kbd> navigate &nbsp; <kbd>↵</kbd> open &nbsp; <kbd>esc</kbd> close</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let repos = [];

  /* ---------- utilities ---------- */
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function shortHome(p) {
    const home = '/Users/jondev';
    if (p === home) return '~';
    if (p.startsWith(home + '/')) return '~' + p.slice(home.length);
    return p;
  }

  const AVATAR_COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39c5cf','#ff9e69','#7ee787'];
  function avatar(name) {
    const clean = (name || '?').trim();
    const initials = clean.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
    let h = 0;
    for (const ch of clean) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const bg = AVATAR_COLORS[h % AVATAR_COLORS.length];
    return `<span class="avatar" style="background:${bg}" title="${escapeHtml(clean)}">${escapeHtml(initials)}</span>`;
  }

  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    setTimeout(() => { el.className = 'toast'; }, 2500);
  }

  /* ---------- list view ---------- */
  async function load() {
    const res = await fetch('/api/repos');
    repos = (await res.json()).map(r => ({...r, _status: null}));
    render();
    repos.forEach((_, i) => fetchStatus(i));
  }

  async function fetchStatus(i) {
    try {
      const res = await fetch('/api/repos/status?path=' + encodeURIComponent(repos[i].path));
      if (res.status === 410) {
        repos[i]._status = {error: true, gone: true, detail: (await res.json()).error};
      } else {
        repos[i]._status = res.ok ? await res.json() : {error: true};
      }
    } catch { repos[i]._status = {error: true}; }
    render();
  }

  function dirtyLabel(d) {
    const parts = [];
    if (d.staged) parts.push(d.staged + ' staged');
    if (d.modified) parts.push(d.modified + ' modified');
    if (d.untracked) parts.push(d.untracked + ' untracked');
    return parts.join(' · ') || 'dirty';
  }

  function render() {
    // Don't clobber the list while the user is in detail view
    if (detailPath) return;
    const list = document.getElementById('repo-list');
    const badge = document.getElementById('count-badge');
    badge.textContent = repos.length + ' repo' + (repos.length !== 1 ? 's' : '');

    if (!repos.length) {
      list.innerHTML = `<div class="empty">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="8" y="12" width="24" height="20" rx="3" stroke="#8b949e" stroke-width="1.5"/>
          <path d="M14 12V9a2 2 0 012-2h8a2 2 0 012 2v3" stroke="#8b949e" stroke-width="1.5"/>
          <path d="M20 20v4M18 22h4" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p>No repos tracked yet. Add one above, or press <kbd>⌘K</kbd>.</p>
      </div>`;
      return;
    }

    list.innerHTML = repos.map((r, i) => {
      const s = r._status;
      let dot = 'status-unknown', label = '';
      if (s && s.gone) { dot = 'status-missing'; label = 'gone from disk'; }
      else if (s && s.error) { dot = 'status-missing'; label = 'error'; }
      else if (s && s.dirty) {
        if (s.dirty.is_clean) { dot = 'status-ok'; label = 'clean'; }
        else { dot = 'status-dirty'; label = dirtyLabel(s.dirty); }
      }
      let meta = '';
      if (s && s.branch) {
        const c = s.last_commit || {};
        meta = `<div class="repo-meta"><span class="branch">${escapeHtml(s.branch)}</span>`;
        if (c.hash) meta += `<span class="rel">${c.hash} · ${c.relative || ''}</span>`;
        meta += '</div>';
        if (c.subject) meta += `<div class="repo-subject">${escapeHtml(c.subject)}</div>`;
      }
      let extra = '';
      if (s && s.sync) {
        extra += s.sync.has_upstream
          ? `<span class="repo-label">↑${s.sync.ahead} ↓${s.sync.behind}</span>`
          : '<span class="repo-label">no upstream</span>';
      }
      if (s && s.stale_branches && s.stale_branches.length) {
        extra += `<span class="repo-label stale" title="${s.stale_branches.map(b => b.name).join(', ')}">${s.stale_branches.length} stale</span>`;
      }
      const loading = (!s) ? '<span class="repo-label"><span class="spinner"></span></span>' : '';
      const displayPath = escapeHtml(shortHome(r.path)).replace('~', '<span class="home">~</span>');
      return `<div class="repo-card" id="card-${i}" onclick="cardClick(event, ${i})">
        <div class="repo-status ${dot}" title="${label}"></div>
        <div class="repo-body">
          <div class="repo-path">${displayPath}</div>
          ${meta}
        </div>
        ${label ? `<span class="repo-label">${label}</span>` : ''}${extra}${loading}
        <div class="repo-actions">
          <button class="btn btn-ghost" onclick="validate(${i})">check</button>
          <button class="btn btn-ghost btn-danger" onclick="removeRepo(${i})">remove</button>
        </div>
      </div>`;
    }).join('');
  }

  async function addRepo() {
    const input = document.getElementById('path-input');
    const btn = document.getElementById('add-btn');
    const path = input.value.trim();
    if (!path) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    const res = await fetch('/api/repos', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path})
    });
    const data = await res.json();
    btn.disabled = false;
    btn.textContent = 'Add repo';
    if (res.status === 201) {
      input.value = '';
      repos.push({path: data.path, _status: null});
      render();
      fetchStatus(repos.length - 1);
      toast('Added ' + shortHome(data.path), 'success');
    } else if (res.status === 409) {
      toast('Already tracked', 'error');
    } else {
      toast(data.error || 'Could not add repo', 'error');
    }
  }

  async function validate(i) {
    const res = await fetch('/api/repos/validate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: repos[i].path})
    });
    const data = await res.json();
    if (!data.valid) { repos[i]._status = {error: true}; render(); return; }
    await fetchStatus(i);
  }

  async function revalidateAll() {
    await Promise.all(repos.map((_, i) => validate(i)));
    toast('All repos re-validated', 'success');
  }

  async function removeRepo(i) {
    const path = repos[i].path;
    const res = await fetch('/api/repos', {
      method: 'DELETE', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path})
    });
    if (res.ok) { repos.splice(i, 1); render(); toast('Removed', 'success'); }
  }

  /* ---------- detail view ---------- */
  let detailPath = null;
  let detailData = null;
  let selectedCommit = 0;
  const expandedCommits = new Set();
  const expandedFiles = new Set();

  function cardClick(event, i) {
    if (event.target.closest('button')) return;
    location.hash = '#/repo/' + encodeURIComponent(repos[i].path);
  }
  function closeDetail() { location.hash = '#/'; }

  async function route() {
    const h = location.hash;
    if (h.startsWith('#/repo/')) {
      await showDetail(decodeURIComponent(h.slice(7)));
    } else {
      detailPath = null;
      document.getElementById('list-view').style.display = '';
      document.getElementById('detail-view').style.display = 'none';
      render();
    }
  }

  async function showDetail(path) {
    detailPath = path;
    selectedCommit = 0;
    expandedCommits.clear();
    expandedFiles.clear();
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('detail-view').style.display = '';
    document.getElementById('detail-header').innerHTML =
      `<h2>${escapeHtml(shortHome(path))}</h2><div class="sub"><span class="spinner"></span> loading…</div>`;
    document.getElementById('tab-commits').innerHTML = '';
    document.getElementById('tab-changes').innerHTML = '';
    document.getElementById('tab-branches').innerHTML = '';
    document.getElementById('tab-github').innerHTML = '';
    document.getElementById('github-count').textContent = '';
    githubData = null; githubLoadedForPath = null;
    switchTab('commits');
    try {
      const res = await fetch('/api/repo?path=' + encodeURIComponent(path));
      if (res.status === 410) {
        const err = await res.json();
        document.getElementById('detail-header').innerHTML =
          `<h2>${escapeHtml(shortHome(path))}</h2>` +
          `<div class="sub" style="color:var(--red-text)">⚠ ${escapeHtml(err.error || 'repo gone from disk')}</div>` +
          `<button class="btn btn-ghost btn-danger" onclick="untrackCurrent()">Remove from tracked list</button>`;
        return;
      }
      if (!res.ok) throw new Error();
      detailData = await res.json();
      detailData.graph = layoutGraph(detailData.commits);
      renderDetail();
    } catch {
      document.getElementById('detail-header').innerHTML =
        `<h2>${escapeHtml(shortHome(path))}</h2><div class="sub" style="color:var(--red-text)">could not load repo detail</div>`;
    }
  }

  async function untrackCurrent() {
    if (!detailPath) return;
    const res = await fetch('/api/repos', {
      method: 'DELETE', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: detailPath})
    });
    if (res.ok) {
      repos = repos.filter(r => r.path !== detailPath);
      toast('Removed gone repo', 'success');
      closeDetail();
    }
  }

  function renderDetail() {
    const d = detailData;
    const dirty = d.changed_files.length;
    document.getElementById('detail-header').innerHTML =
      `<h2>${escapeHtml(shortHome(d.path))}</h2>` +
      `<div class="sub" title="${escapeHtml(d.path)}">on <strong>${escapeHtml(d.branch)}</strong> · ` +
      `${d.commits.length} commits · ${d.branches.length} branches` +
      (dirty ? ` · <span style="color:var(--yellow)">${dirty} changed</span>` : ' · clean') + '</div>';
    document.getElementById('changes-count').textContent = dirty ? `(${dirty})` : '';
    renderCommits();
    renderChanges();
    renderBranches();
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t =>
      t.classList.toggle('active', t.dataset.tab === name));
    ['commits', 'changes', 'branches', 'github'].forEach(n =>
      document.getElementById('tab-' + n).style.display = n === name ? '' : 'none');
    if (name === 'github' && detailPath && !githubLoadedForPath) loadGithub();
  }

  let githubData = null, githubLoadedForPath = null;

  async function loadGithub() {
    const el = document.getElementById('tab-github');
    el.innerHTML = '<div class="empty"><p><span class="spinner"></span> loading from GitHub…</p></div>';
    try {
      const res = await fetch('/api/github?path=' + encodeURIComponent(detailPath));
      githubData = await res.json();
      githubLoadedForPath = detailPath;
      renderGithub();
    } catch {
      el.innerHTML = '<div class="empty"><p>Could not reach GitHub.</p></div>';
    }
  }

  function ciBadge(ci) {
    if (!ci || ci.state === 'none') return '<span class="ci-badge ci-none" title="no checks">–</span>';
    if (ci.state === 'pass') return `<span class="ci-badge ci-pass" title="${ci.passing}/${ci.total} passing">✓</span>`;
    if (ci.state === 'fail') return `<span class="ci-badge ci-fail" title="${ci.total - ci.passing}/${ci.total} failing">✗</span>`;
    return `<span class="ci-badge ci-pending" title="${ci.passing}/${ci.total} done">…</span>`;
  }

  function renderGithub() {
    const el = document.getElementById('tab-github');
    const g = githubData;
    const total = g.prs.length + g.issues.length;
    document.getElementById('github-count').textContent = g.has_github && total ? `(${total})` : '';
    if (!g.has_github) {
      el.innerHTML = g.gh_unavailable
        ? '<div class="empty"><p><code>gh</code> is not available — install and run <code>gh auth login</code> to see PRs and issues.</p></div>'
        : '<div class="empty"><p>No GitHub remote for this repo.</p></div>';
      return;
    }
    let html = `<div class="gh-section-title">Open pull requests (${g.prs.length}) · <a href="${g.repo_url}/pulls" target="_blank" rel="noopener" style="color:var(--accent);text-transform:none">${escapeHtml(g.repo)}</a></div>`;
    html += g.prs.length ? g.prs.map(pr =>
      `<div class="pr-row">${ciBadge(pr.ci)}
        <div class="pr-body">
          <div class="pr-title"><a href="${pr.url}" target="_blank" rel="noopener">${escapeHtml(pr.title)}</a></div>
          <div class="pr-meta">${pr.branch ? `<span class="branch" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0 8px;font-size:11px;color:var(--accent)">${escapeHtml(pr.branch)}</span> · ` : ''}${pr.ci.total ? `${pr.ci.passing}/${pr.ci.total} checks` : 'no checks'}</div>
        </div>
        <span class="pr-num">#${pr.number}</span>
        <a class="ext-link" href="${pr.url}" target="_blank" rel="noopener" title="open on github">↗</a>
      </div>`).join('')
      : '<div class="empty"><p>No open pull requests.</p></div>';
    html += `<div class="gh-section-title">Open issues (${g.issues.length})</div>`;
    html += g.issues.length ? g.issues.map(i =>
      `<div class="issue-row">
        <div class="issue-body">
          <div class="issue-title"><a href="${i.url}" target="_blank" rel="noopener">${escapeHtml(i.title)}</a></div>
        </div>
        <span class="pr-num">#${i.number}</span>
        <a class="ext-link" href="${i.url}" target="_blank" rel="noopener" title="open on github">↗</a>
      </div>`).join('')
      : '<div class="empty"><p>No open issues.</p></div>';
    el.innerHTML = html;
  }

  /* ----- commit graph: replay lane assignment, draw SVG connectors ----- */
  const LANE_COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39c5cf'];
  function layoutGraph(commits) {
    const lanes = [];
    return commits.map(c => {
      let lane = lanes.indexOf(c.hash);
      if (lane === -1) {
        lane = lanes.indexOf(null);
        if (lane === -1) { lane = lanes.length; lanes.push(null); }
      }
      const before = [...lanes];
      if (c.parents && c.parents.length) {
        lanes[lane] = c.parents[0];
        c.parents.slice(1).forEach(p => {
          if (!lanes.includes(p)) {
            const f = lanes.indexOf(null);
            if (f === -1) lanes.push(p); else lanes[f] = p;
          }
        });
      } else lanes[lane] = null;
      return {lane, before, after: [...lanes], width: lanes.length};
    });
  }

  function graphSvg(g, isMerge) {
    const W = 14, rows = g.width || 1;
    const H = 30, cy = H / 2, cx = g.lane * W + W / 2;
    const col = LANE_COLORS[g.lane % LANE_COLORS.length];
    let s = `<svg width="${rows * W}" height="${H}">`;
    const active = new Set();
    g.before.forEach((h, i) => { if (h) active.add(i); });
    g.after.forEach((h, i) => { if (h) active.add(i); });
    active.forEach(i => {
      if (i === g.lane) return;
      const x = i * W + W / 2;
      const c = LANE_COLORS[i % LANE_COLORS.length];
      s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${c}" stroke-width="2" opacity="0.45"/>`;
    });
    // through-line for own lane
    s += `<line x1="${cx}" y1="0" x2="${cx}" y2="${H}" stroke="${col}" stroke-width="2" opacity="0.45"/>`;
    // merge curve: second parent lane joins
    if (isMerge && g.after.length > g.lane + 1) {
      const px = (g.lane + 1) * W + W / 2;
      s += `<path d="M ${px} 0 C ${px} ${cy - 6}, ${cx} ${cy - 6}, ${cx} ${cy}" stroke="${col}" stroke-width="2" fill="none" opacity="0.7"/>`;
    }
    s += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="#0d1117" stroke="${col}" stroke-width="2.5"/>`;
    if (isMerge) s += `<circle cx="${cx}" cy="${cy}" r="1.6" fill="${col}"/>`;
    return s + '</svg>';
  }

  function renderCommits() {
    const el = document.getElementById('tab-commits');
    const commits = detailData.commits;
    if (!commits.length) { el.innerHTML = '<div class="empty"><p>No commits yet.</p></div>'; return; }
    el.innerHTML = commits.map((c, i) => {
      const g = detailData.graph[i];
      const open = expandedCommits.has(c.hash);
      const tags = (c.branches || []).map(b => `<span class="tag-branch">${escapeHtml(b)}</span>`).join('');
      return `<div class="commit-row${c.is_merge ? ' merge' : ''}${i === selectedCommit ? ' selected' : ''}" data-i="${i}" onclick="toggleCommit('${c.hash}')">
        <div class="commit-graph">${graphSvg(g, c.is_merge)}</div>
        <div class="commit-body">
          <div class="commit-top">
            <div class="commit-subject">${escapeHtml(c.subject)}</div>
            <div class="commit-side">${avatar(c.author)}
              <span class="commit-hash" onclick="copyHash(event, '${c.short}', '${c.hash}')" title="click to copy full hash">${c.short}</span>
            </div>
          </div>
          <div class="commit-meta"><span class="author">${escapeHtml(c.author)}</span> · ${c.relative}${c.is_merge ? ' · merge' : ''}</div>
          ${tags ? `<div class="commit-tags">${tags}</div>` : ''}
          <div id="diff-${c.hash}" style="display:${open ? '' : 'none'}">${open ? '<div class="diff-box"><pre><span class="diff-ctx">loading…</span></pre></div>' : ''}</div>
        </div>
      </div>`;
    }).join('');
    expandedCommits.forEach(h => loadCommitDiff(h));
  }

  function selectCommit(i) {
    const n = detailData.commits.length;
    selectedCommit = Math.max(0, Math.min(n - 1, i));
    document.querySelectorAll('.commit-row').forEach(r =>
      r.classList.toggle('selected', +r.dataset.i === selectedCommit));
    const row = document.querySelector(`.commit-row[data-i="${selectedCommit}"]`);
    if (row) row.scrollIntoView({block: 'nearest'});
  }

  async function toggleCommit(hash) {
    expandedCommits.has(hash) ? expandedCommits.delete(hash) : expandedCommits.add(hash);
    renderCommits();
  }

  async function loadCommitDiff(hash) {
    const el = document.getElementById('diff-' + hash);
    if (!el) return;
    el.style.display = '';
    try {
      const res = await fetch('/api/commit?path=' + encodeURIComponent(detailPath) + '&hash=' + hash);
      el.innerHTML = `<div class="diff-box"><pre>${renderDiff(await res.text())}</pre></div>`;
    } catch { el.innerHTML = '<div class="diff-box"><pre>failed to load diff</pre></div>'; }
  }

  function copyHash(event, short, full) {
    event.stopPropagation();
    navigator.clipboard.writeText(full).then(
      () => toast('Copied ' + full, 'success'),
      () => toast(short, ''));
  }

  /* ----- changes ----- */
  function renderChanges() {
    const el = document.getElementById('tab-changes');
    const files = detailData.changed_files;
    if (!files.length) { el.innerHTML = '<div class="empty"><p>Working tree is clean.</p></div>'; return; }
    el.innerHTML = files.map(f => {
      const badge = f.untracked ? '<span class="file-badge badge-untracked">untracked</span>'
        : f.staged ? '<span class="file-badge badge-staged">staged</span>'
        : '<span class="file-badge badge-unstaged">modified</span>';
      const open = expandedFiles.has(f.path);
      const safe = escapeHtml(f.path).replace(/'/g, '&#39;');
      return `<div class="file-row" onclick="toggleFile('${safe}')">
        <div class="fname">${escapeHtml(f.path)}</div>${badge}
      </div>
      <div id="${fileDiffId(f.path)}" style="display:${open ? '' : 'none'}">${open ? '<div class="diff-box"><pre>loading…</pre></div>' : ''}</div>`;
    }).join('');
    expandedFiles.forEach(p => loadFileDiff(p));
  }

  async function toggleFile(path) {
    expandedFiles.has(path) ? expandedFiles.delete(path) : expandedFiles.add(path);
    renderChanges();
  }
  function fileDiffId(path) {
    return 'fdiff-' + btoa(unescape(encodeURIComponent(path))).replace(/=/g, '');
  }
  async function loadFileDiff(path) {
    const el = document.getElementById(fileDiffId(path));
    if (!el) return;
    el.style.display = '';
    try {
      const res = await fetch('/api/working-diff?path=' + encodeURIComponent(detailPath) + '&file=' + encodeURIComponent(path));
      el.innerHTML = `<div class="diff-box"><pre>${renderDiff(await res.text())}</pre></div>`;
    } catch { el.innerHTML = '<div class="diff-box"><pre>failed to load diff</pre></div>'; }
  }

  /* ----- branches ----- */
  function branchRow(b) {
    const isRemote = b.kind === 'remote';
    const kindBadge = isRemote ? ' <span class="tag-remote">remote</span>' : '';
    const cur = b.current ? ' <span class="tag-branch">current</span>' : '';
    const dot = b.current ? 'var(--green)' : isRemote ? 'var(--purple)' : 'var(--muted)';
    let meta;
    if (isRemote) {
      const tracked = (b.tracked_by && b.tracked_by.length)
        ? ` · tracked by ${b.tracked_by.map(escapeHtml).join(', ')}` : '';
      meta = `${b.last_commit} · ${b.relative}${tracked}`;
    } else {
      const sync = b.has_upstream ? `↑${b.ahead} ↓${b.behind}` : 'no upstream';
      meta = `${b.last_commit} · ${b.relative} · ${sync}`;
    }
    const stale = b.stale ? ' <span class="bstale">· stale</span>' : '';
    return `<div class="branch-row${b.current ? ' current' : ''}${isRemote ? ' remote' : ''}">
      <div class="dot" style="background:${dot}"></div>
      <div><div class="bname">${escapeHtml(b.name)}${kindBadge}${cur}</div>
      <div class="bmeta">${meta}${stale}</div></div>
    </div>`;
  }

  function renderBranches() {
    const el = document.getElementById('tab-branches');
    const branches = detailData.branches || [];
    if (!branches.length) { el.innerHTML = '<div class="empty"><p>No branches.</p></div>'; return; }
    const locals = branches.filter(b => b.kind !== 'remote');
    const remotes = branches.filter(b => b.kind === 'remote');
    let html = '';
    if (locals.length) {
      html += `<div class="branch-group">Local (${locals.length})</div>` +
        locals.map(branchRow).join('');
    }
    if (remotes.length) {
      html += `<div class="branch-group">Remote (${remotes.length})</div>` +
        remotes.map(branchRow).join('');
    }
    el.innerHTML = html;
  }

  /* ----- diff rendering: file headers + per-file stats + word highlight ----- */
  function renderDiff(text) {
    // Split into file sections on "diff --git"
    const files = text.split(/(?=^diff --git )/m);
    return files.map(section => {
      const lines = section.split('\n');
      let adds = 0, dels = 0, fname = '';
      const m = section.match(/^diff --git a\/(.+?) b\//m);
      if (m) fname = m[1];
      lines.forEach(l => {
        if (l.startsWith('+') && !l.startsWith('+++')) adds++;
        else if (l.startsWith('-') && !l.startsWith('---')) dels++;
      });
      let html = '';
      if (fname) {
        html += `<div class="diff-file-head"><span class="fname">${escapeHtml(fname)}</span>` +
          `<span class="fstat"><span class="a">+${adds}</span> <span class="d">−${dels}</span></span></div>`;
      }
      html += pairLines(lines).map(renderLine).join('');
      return html;
    }).join('');
  }

  // Pair adjacent del/add lines for word-level highlighting
  function pairLines(lines) {
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (l.startsWith('-') && !l.startsWith('---') &&
          i + 1 < lines.length && lines[i + 1].startsWith('+') && !lines[i + 1].startsWith('+++')) {
        out.push({del: l.slice(1), add: lines[i + 1].slice(1)});
        i++;
      } else {
        out.push({raw: l});
      }
    }
    return out;
  }

  function wordDiff(a, b) {
    // Longest-common-subsequence on whitespace-split tokens
    const at = a.split(/(\s+)/), bt = b.split(/(\s+)/);
    const n = at.length, m = bt.length;
    if (n * m > 20000) return null; // too big, skip
    const dp = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        dp[i][j] = at[i] === bt[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0, ra = '', rb = '';
    while (i < n && j < m) {
      if (at[i] === bt[j]) { ra += escapeHtml(at[i]); rb += escapeHtml(bt[j]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ra += `<span class="w">${escapeHtml(at[i])}</span>`; i++; }
      else { rb += `<span class="w">${escapeHtml(bt[j])}</span>`; j++; }
    }
    while (i < n) { ra += `<span class="w">${escapeHtml(at[i++])}</span>`; }
    while (j < m) { rb += `<span class="w">${escapeHtml(bt[j++])}</span>`; }
    return {a: ra, b: rb};
  }

  function renderLine(item) {
    if (item.raw !== undefined) {
      const line = item.raw, esc = escapeHtml(line) || ' ';
      if (line.startsWith('+') && !line.startsWith('+++')) return `<span class="dl diff-add">${esc}</span>`;
      if (line.startsWith('-') && !line.startsWith('---')) return `<span class="dl diff-del">${esc}</span>`;
      if (line.startsWith('@@')) return `<span class="dl diff-hunk">${esc}</span>`;
      if (/^(diff |index |--- |\+\+\+ |commit |Binary )/.test(line)) return `<span class="dl diff-head">${esc}</span>`;
      return `<span class="dl diff-ctx">${esc}</span>`;
    }
    const w = wordDiff(item.del, item.add);
    if (!w) {
      return `<span class="dl diff-del">-${escapeHtml(item.del)}</span>` +
             `<span class="dl diff-add">+${escapeHtml(item.add)}</span>`;
    }
    return `<span class="dl diff-del">-${w.a}</span><span class="dl diff-add">+${w.b}</span>`;
  }

  /* ---------- command palette ---------- */
  let paletteIdx = 0, paletteItems = [];

  function fuzzyMatch(hay, needle) {
    // Minimal-span subsequence match: prefer contiguous / tight matches
    // over leftmost-scattered ones (e.g. 'tinkr' -> 'tink-r', not 'acTi-ve...NKR').
    hay = hay.toLowerCase(); needle = needle.toLowerCase();
    if (!needle) return [];
    let best = null;
    for (let start = 0; start < hay.length; start++) {
      if (hay[start] !== needle[0]) continue;
      const hits = [start];
      let hi = start + 1, ok = true;
      for (let ni = 1; ni < needle.length; ni++) {
        hi = hay.indexOf(needle[ni], hi);
        if (hi === -1) { ok = false; break; }
        hits.push(hi++);
      }
      if (!ok) continue;
      const span = hits[hits.length - 1] - hits[0];
      if (!best || span < best.span || (span === best.span && start < best.hits[0])) {
        best = {hits, span};
      }
      if (span === needle.length - 1) break; // can't beat contiguous
    }
    return best ? best.hits : null;
  }

  function openPalette() {
    document.getElementById('palette-overlay').classList.add('open');
    const input = document.getElementById('palette-input');
    input.value = '';
    renderPalette('');
    setTimeout(() => input.focus(), 0);
  }
  function closePalette() {
    document.getElementById('palette-overlay').classList.remove('open');
  }

  function renderPalette(q) {
    const list = document.getElementById('palette-list');
    const all = repos
      .map(r => ({path: r.path, display: shortHome(r.path),
                   hits: q ? fuzzyMatch(shortHome(r.path), q) : []}))
      .filter(r => !q || r.hits);
    const overflow = all.length - Math.min(all.length, 9);
    paletteItems = all.slice(0, 9);
    list.dataset.overflow = overflow > 0 ? `+${overflow} more` : '';
    paletteIdx = Math.min(paletteIdx, Math.max(0, paletteItems.length - 1));
    if (!paletteItems.length) {
      list.innerHTML = '<div class="palette-item" style="color:var(--muted)">No matches</div>';
      return;
    }
    list.innerHTML = paletteItems.map((r, i) => {
      let html = '';
      if (q && r.hits) {
        const hitSet = new Set(r.hits);
        html = [...r.display].map((ch, idx) =>
          hitSet.has(idx) ? `<span class="match">${escapeHtml(ch)}</span>` : escapeHtml(ch)).join('');
      } else html = escapeHtml(r.display);
      return `<div class="palette-item${i === paletteIdx ? ' active' : ''}" onclick="paletteOpen(${i})">${html}</div>`;
    }).join('') + (list.dataset.overflow
      ? `<div class="palette-item" style="color:var(--muted);cursor:default">${list.dataset.overflow} — keep typing to narrow</div>` : '');
  }

  function paletteOpen(i) {
    const item = paletteItems[i ?? paletteIdx];
    if (!item) return;
    closePalette();
    location.hash = '#/repo/' + encodeURIComponent(item.path);
  }

  document.getElementById('palette-input').addEventListener('input', e => {
    paletteIdx = 0;
    renderPalette(e.target.value);
  });
  document.getElementById('palette-input').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteIdx = Math.min(paletteItems.length - 1, paletteIdx + 1); renderPalette(e.target.value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); paletteIdx = Math.max(0, paletteIdx - 1); renderPalette(e.target.value); }
    else if (e.key === 'Enter') { paletteOpen(); }
  });

  /* ---------- global keyboard ---------- */
  document.addEventListener('keydown', e => {
    const inPalette = document.getElementById('palette-overlay').classList.contains('open');
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      inPalette ? closePalette() : openPalette();
      return;
    }
    if (inPalette) {
      if (e.key === 'Escape') closePalette();
      return;
    }
    if (typing) return;
    if (e.key === 'Escape') {
      if (detailPath) closeDetail();
      return;
    }
    if (!detailPath) return;
    if (e.key === 'j') { selectCommit(selectedCommit + 1); }
    else if (e.key === 'k') { selectCommit(selectedCommit - 1); }
    else if (e.key === 'Enter') {
      const c = detailData?.commits[selectedCommit];
      if (c) toggleCommit(c.hash);
    }
    else if (e.key === '1') switchTab('commits');
    else if (e.key === '2') switchTab('changes');
    else if (e.key === '3') switchTab('branches');
    else if (e.key === '4') switchTab('github');
  });

  document.getElementById('path-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addRepo();
  });

  window.addEventListener('hashchange', route);
  load().then(route);
</script>
</body>
</html>
