<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>repo-root-tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --accent: #5b8dee;
    --accent-dim: #3a5ca8;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e2e8f0;
    --muted: #64748b;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header svg { flex-shrink: 0; }

  .header-text h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .header-text p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .badge {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--muted);
  }

  main { max-width: 760px; margin: 0 auto; padding: 28px 24px; }

  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  .add-form input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }

  .add-form input:focus { border-color: var(--accent); }
  .add-form input::placeholder { color: var(--muted); }

  .btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    font-size: 12px;
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-header h2 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .repo-list { display: flex; flex-direction: column; gap: 6px; }

  .repo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .repo-card:hover { border-color: var(--accent); }

  .repo-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-ok      { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dirty   { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .status-missing { background: var(--red);   box-shadow: 0 0 6px var(--red); }
  .status-unknown { background: var(--muted); }

  .repo-body { flex: 1; min-width: 0; }

  .repo-meta {
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .repo-meta .branch {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
  }

  .repo-meta .commit {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 320px;
  }

  .repo-meta .rel { font-size: 11px; }

  .repo-label.stale { color: var(--yellow); }

  .repo-path {
    flex: 1;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    word-break: break-all;
  }

  .repo-label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .repo-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }
  .empty svg { margin: 0 auto 12px; opacity: 0.4; display: block; }
  .empty p { font-size: 13px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--red); color: var(--red); }
  .toast.success { border-color: var(--green); color: var(--green); }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="7" fill="#1e2235"/>
    <circle cx="14" cy="10" r="3" stroke="#5b8dee" stroke-width="1.5"/>
    <path d="M14 13v5" stroke="#5b8dee" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M9 21c0-2.76 2.24-5 5-5s5 2.24 5 5" stroke="#5b8dee" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="20" r="2" fill="#4ade80"/>
    <circle cx="20" cy="20" r="2" fill="#4ade80"/>
  </svg>
  <div class="header-text">
    <h1>repo-root-tracker</h1>
    <p>Track git repository roots on this machine</p>
  </div>
  <span class="badge" id="count-badge">— repos</span>
</header>

<main>
  <div class="add-form">
    <input id="path-input" type="text" placeholder="/Users/you/dev/myproject  or  ~/dev/myproject" autocomplete="off" spellcheck="false">
    <button class="btn" id="add-btn" onclick="addRepo()">Add repo</button>
  </div>

  <div class="section-header">
    <h2>Tracked repositories</h2>
    <button class="btn btn-ghost" onclick="revalidateAll()">Re-validate all</button>
  </div>

  <div class="repo-list" id="repo-list">
    <div class="empty">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect x="8" y="12" width="24" height="20" rx="3" stroke="#64748b" stroke-width="1.5"/>
        <path d="M14 12V9a2 2 0 012-2h8a2 2 0 012 2v3" stroke="#64748b" stroke-width="1.5"/>
        <path d="M20 20v4M18 22h4" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p>No repos tracked yet. Add one above.</p>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  let repos = [];

  async function load() {
    const res = await fetch('/api/repos');
    repos = (await res.json()).map(r => ({...r, _status: null}));
    render();
    // Fetch status per card without blocking the list
    repos.forEach((_, i) => fetchStatus(i));
  }

  async function fetchStatus(i) {
    const card = document.getElementById('card-' + i);
    try {
      const res = await fetch('/api/repos/status?path=' + encodeURIComponent(repos[i].path));
      if (!res.ok) { repos[i]._status = {error: true}; }
      else { repos[i]._status = await res.json(); }
    } catch {
      repos[i]._status = {error: true};
    }
    render();
  }

  function render() {
    const list = document.getElementById('repo-list');
    const badge = document.getElementById('count-badge');
    badge.textContent = repos.length + ' repo' + (repos.length !== 1 ? 's' : '');

    if (repos.length === 0) {
      list.innerHTML = `<div class="empty">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="8" y="12" width="24" height="20" rx="3" stroke="#64748b" stroke-width="1.5"/>
          <path d="M14 12V9a2 2 0 012-2h8a2 2 0 012 2v3" stroke="#64748b" stroke-width="1.5"/>
          <path d="M20 20v4M18 22h4" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p>No repos tracked yet. Add one above.</p>
      </div>`;
      return;
    }

    list.innerHTML = repos.map((r, i) => {
      const s = r._status;
      // Status dot: green clean, yellow dirty, red missing, grey loading
      let dot = 'status-unknown', label = '';
      if (s && s.error) { dot = 'status-missing'; label = 'error'; }
      else if (s && s.dirty) {
        if (s.dirty.is_clean) { dot = 'status-ok'; label = 'clean'; }
        else { dot = 'status-dirty'; label = dirtyLabel(s.dirty); }
      }
      // Branch + last commit line
      let meta = '';
      if (s && s.branch) {
        const c = s.last_commit || {};
        meta = `<div class="repo-meta"><span class="branch">${s.branch}</span>`;
        if (c.hash) meta += ` <span class="commit">${c.hash} ${escapeHtml(c.subject || '')}</span> <span class="rel">${c.relative || ''}</span>`;
        meta += '</div>';
      }
      // Sync line
      let sync = '';
      if (s && s.sync) {
        sync = s.sync.has_upstream
          ? `<span class="repo-label">↑${s.sync.ahead} ↓${s.sync.behind}</span>`
          : '<span class="repo-label">no upstream</span>';
      }
      // Stale branches
      let stale = '';
      if (s && s.stale_branches && s.stale_branches.length > 0) {
        stale = `<span class="repo-label stale" title="${s.stale_branches.map(b => b.name).join(', ')}">${s.stale_branches.length} stale</span>`;
      }
      const loading = (!s) ? '<span class="repo-label"><span class="spinner"></span></span>' : '';
      return `<div class="repo-card" id="card-${i}">
        <div class="repo-status ${dot}" title="${label}"></div>
        <div class="repo-body">
          <div class="repo-path">${r.path}</div>
          ${meta}
        </div>
        ${label ? `<span class="repo-label">${label}</span>` : ''}
        ${sync}${stale}${loading}
        <div class="repo-actions">
          <button class="btn btn-ghost" onclick="validate(${i})">check</button>
          <button class="btn btn-ghost" onclick="removeRepo(${i})" style="color:var(--red)">remove</button>
        </div>
      </div>`;
    }).join('');
  }

  function dirtyLabel(d) {
    const parts = [];
    if (d.staged) parts.push(d.staged + ' staged');
    if (d.modified) parts.push(d.modified + ' modified');
    if (d.untracked) parts.push(d.untracked + ' untracked');
    return parts.join(', ') || 'dirty';
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  }

  async function addRepo() {
    const input = document.getElementById('path-input');
    const btn = document.getElementById('add-btn');
    const path = input.value.trim();
    if (!path) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    const res = await fetch('/api/repos', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path})
    });
    const data = await res.json();
    btn.disabled = false;
    btn.textContent = 'Add repo';

    if (res.status === 201) {
      input.value = '';
      repos.push({path: data.path, _status: null});
      render();
      fetchStatus(repos.length - 1);
      toast('Added ' + data.path, 'success');
    } else if (res.status === 409) {
      toast('Already tracked', 'error');
    } else {
      toast(data.error || 'Could not add repo', 'error');
    }
  }

  async function validate(i) {
    // Re-check existence, then refresh full status
    const res = await fetch('/api/repos/validate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: repos[i].path})
    });
    const data = await res.json();
    if (!data.valid) {
      repos[i]._status = {error: true};
      render();
      return;
    }
    await fetchStatus(i);
  }

  async function revalidateAll() {
    await Promise.all(repos.map((_, i) => validate(i)));
    toast('All repos re-validated', 'success');
  }

  async function removeRepo(i) {
    const path = repos[i].path;
    const res = await fetch('/api/repos', {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path})
    });
    if (res.ok) {
      repos.splice(i, 1);
      render();
      toast('Removed', 'success');
    }
  }

  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    setTimeout(() => { el.className = 'toast'; }, 2500);
  }

  document.getElementById('path-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addRepo();
  });

  load();
</script>
</body>
</html>
