[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-root-tracker"
version = "0.1.0"
description = "Find the git repository root by walking up from a given path"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "jondev" }
]
keywords = ["git", "repository", "root", "tink"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
repo-root-tracker = "repo_root_tracker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_root_tracker"]
